# Verifies a self-attested signed receipt for the exact source commit.
# The evidence Git branch is separate from user code/staging.
name: PoHW Receipt Verification
on:
  push:
    branches: [@@DEFAULT_BRANCH@@]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pohw-badge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify evidence for source commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check pinned PoHW verifier code
        shell: bash
        run: |
          echo "@@HASH_PROOF@@  .pohw/proof.js" | sha256sum --check --status
          echo "@@HASH_CLI@@  .pohw/verify.cjs" | sha256sum --check --status
      - name: Wait for separately pushed signed evidence
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if git fetch --no-tags origin refs/heads/pohw-evidence >/dev/null 2>&1 && \
               git show "FETCH_HEAD:receipts/${GITHUB_SHA}.json" > "$RUNNER_TEMP/pohw-receipt.json" 2>/dev/null; then
              exit 0
            fi
            sleep 3
          done
          echo "PoHW evidence is missing for $GITHUB_SHA" >&2
          exit 1
      - name: Verify signature, commit binding and source tree
        run: node .pohw/verify.cjs . "$RUNNER_TEMP/pohw-receipt.json" "$RUNNER_TEMP/pohw-summary.json"
      - uses: actions/upload-artifact@v4
        with:
          name: pohw-verified-summary
          path: ${{ runner.temp }}/pohw-summary.json
          if-no-files-found: error
  publish:
    name: Publish verified badges
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pohw-verified-summary
          path: ${{ runner.temp }}/pohw-verified
      - name: Publish verified summary to independent badge branch
        env:
          VERIFIED_FILE: ${{ runner.temp }}/pohw-verified/pohw-summary.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git fetch origin pohw-badges; then
            git switch -C pohw-badges-generated FETCH_HEAD
          else
            git switch --orphan pohw-badges-generated
            git rm -rf --ignore-unmatch . >/dev/null
          fi
          cp "$VERIFIED_FILE" summary.json
          node <<'NODE'
          const fs = require('node:fs');
          const summary = JSON.parse(fs.readFileSync(process.env.VERIFIED_FILE, 'utf8'));
          const repo = process.env.GITHUB_REPOSITORY;
          const commit = process.env.GITHUB_SHA;
          if (!/^[\\w.-]+\\/[\\w.-]+$/.test(repo) || !/^[a-f0-9]{40}$/.test(commit)) {
            throw new Error('Invalid GitHub repository or source commit');
          }
          const score = typeof summary.humanScore === 'number' ? summary.humanScore + '%' : 'N/A';
          const coverage = String(summary.monitoredCoverage) + '%';
          const sha = /^[a-f0-9]{64}$/.test(summary.sourceCodeHash || '') ? summary.sourceCodeHash : 'Not provided';
          const verifiedAt = typeof summary.issuedAt === 'string' && /^\\d{4}-\\d{2}-\\d{2}T/.test(summary.issuedAt) ? summary.issuedAt : 'Not provided';
          const report = [
            '# PoHW Verified Editing Report',
            '',
            '> This page is generated by GitHub Actions from the most recent **successfully verified** signed receipt. Newer commits may exist; compare the source commit below with the repository default branch.',
            '',
            '| Field | Verified value |',
            '| --- | --- |',
            '| Editing evidence score | **' + score + '** |',
            '| Monitored code coverage | **' + coverage + '** |',
            '| Receipt verification | Signature and committed source contents match |',
            '| Assurance | Self-attested local editor session |',
            '| Receipt issued at (UTC) | ' + verifiedAt + ' |',
            '',
            '## Source and evidence',
            '',
            '- [Verified source commit](https://github.com/' + repo + '/commit/' + commit + ') (`' + commit + '`)',
            '- [Signed evidence receipt](https://github.com/' + repo + '/blob/pohw-evidence/receipts/' + commit + '.json)',
            '- [Receipt verification workflow](https://github.com/' + repo + '/actions/workflows/pohw-verify.yml)',
            '- Source file manifest root (SHA-256): `' + sha + '`',
            '',
            '## Interpretation',
            '',
            'The **editing evidence score** is a rule-based, uncalibrated score for monitored code only. Coverage is the fraction of eligible code for which monitored provenance is available. Neither score is a statistical probability of human authorship.',
            '',
            'Ed25519 verification confirms that the committed source matches the self-attested signed receipt. It does **not** prove AI was absent or that the underlying editing history could not have been fabricated.',
            ''
          ].join('\\n');
          fs.writeFileSync('REPORT.md', report);
          NODE
          git add summary.json REPORT.md
          if git diff --cached --quiet; then
            echo "PoHW badge report already up to date"
            exit 0
          fi
          git commit -m "chore: publish verified PoHW summary for $GITHUB_SHA"
          git push origin HEAD:refs/heads/pohw-badges